name: Deploy Product Features Atlas

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'revised_product_features_atlas_assets/**'
      - '.github/workflows/deploy-product-atlas.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage atlas site
        shell: bash
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp -R revised_product_features_atlas_assets _site/

      - name: Publish gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./_site
          force_orphan: true
