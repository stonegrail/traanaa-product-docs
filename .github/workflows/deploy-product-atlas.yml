name: Deploy Product Features Atlas

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'revised_product_features_atlas_assets/**'
      - '.github/workflows/deploy-product-atlas.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Stage atlas site
        shell: bash
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp -R revised_product_features_atlas_assets _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
